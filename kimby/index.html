<script>
(function(){
const S={config:null,salidas:[],movs:[],reps:{},at:null};
const $=s=>document.querySelector(s);
const TZ='America/Bogota';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cop=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const nf=new Intl.NumberFormat('es-CO');
const money=n=>cop.format(Math.round(n||0));
const todayISO=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const fmtD=(iso,opt)=>{if(!iso)return '';const d=new Date(iso+'T12:00:00');return d.toLocaleDateString('es-CO',opt||{weekday:'short',day:'numeric',month:'short'})};
const fmtLong=iso=>fmtD(iso,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.-]/g,''));return isFinite(n)?n:0};
const cities=()=>S.config?.cities||[];
const products=()=>S.config?.products||[];
const merch=()=>products().filter(p=>!p.bolsa);
const NAC='nacional';
const cityName=id=>id===NAC?'Bodega nacional':(cities().find(c=>c.id===id)?.name||id);
const salidasOf=cid=>S.salidas.filter(s=>s.city===cid).sort((a,b)=>a.date.localeCompare(b.date));
function stockOf(cid){
  const st={};products().forEach(p=>st[p.id]=0);
  for(const m of S.movs){const it=m.items||{};
    for(const pid in it){const q=num(it[pid]);if(!(pid in st))st[pid]=0;
      if(m.tipo==='recepcion'&&m.ciudad===cid)st[pid]+=q;
      else if(m.tipo==='ajuste'&&m.ciudad===cid)st[pid]+=q;
      else if(m.tipo==='traslado'){if(m.destino===cid&&m.estado!=='despachado')st[pid]+=q;if(m.origen===cid)st[pid]-=q;}}}
  for(const sid in S.reps){const r=S.reps[sid];const rc=S.salidas.find(x=>x.id===sid)?.city||r.city;if(rc!==cid)continue;const e=r.entregado||{};for(const pid in e){if(!(pid in st))st[pid]=0;st[pid]-=num(e[pid]);}}
  return st;
}
function transitOf(cid){const st={};products().forEach(p=>st[p.id]=0);
  for(const m of S.movs){if(m.tipo!=='traslado'||m.destino!==cid||m.estado!=='despachado')continue;for(const pid in (m.items||{}))st[pid]=(st[pid]||0)+num(m.items[pid]);}return st;}
const transitShips=cid=>S.movs.filter(m=>m.tipo==='traslado'&&m.destino===cid&&m.estado==='despachado').sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
const merchCount=e=>merch().reduce((a,p)=>a+num(e?.[p.id]),0);
function metrics(cid){
  const t=todayISO();const list=salidasOf(cid);const st=stockOf(cid);
  let ventas=0,entregados=0,hechas=0;const sinRep=[],pend=[];
  for(const s of list){const r=S.reps[s.id];
    if(r){hechas++;ventas+=num(r.ventas);entregados+=merchCount(r.entregado);}
    else if(s.date<t)sinRep.push(s);else pend.push(s);}
  const next1=pend.slice(0,1),next3=pend.slice(0,3),next4=pend.slice(0,4);/* next4 incluye stock de emergencia (1 salida extra) */
  const per={};let status='ok';const falt=[];
  for(const p of products()){const need1=next1.length*num(p.perSalida),need4=next4.length*num(p.perSalida),needAll=pend.length*num(p.perSalida);
    let s='ok';if(st[p.id]<need1)s='critico';else if(st[p.id]<need4)s='riesgo';
    per[p.id]={stock:st[p.id],need1,need4,needAll,s,falta:Math.max(0,needAll-st[p.id])};
    if(s==='critico')status='critico';else if(s==='riesgo'&&status==='ok')status='riesgo';
    if(s!=='ok')falt.push({p,need:s==='critico'?need1:need4,stock:st[p.id],s});}
  if(!pend.length)status='ok';
  return {list,st,ventas,entregados,hechas,sinRep,pend,next1,next3,next4,per,status,falt,ticket:entregados?ventas/entregados:0};
}
function repRows(filter){
  const out=[];for(const s of S.salidas){const r=S.reps[s.id];if(!r)continue;if(filter&&!filter(s,r))continue;out.push({s,r});}
  return out.sort((a,b)=>a.s.date.localeCompare(b.s.date)||cityName(a.s.city).localeCompare(cityName(b.s.city)));
}
/* ---------- KIMBY (VISTA CLIENTE) ---------- */
const kmCls=(e,p)=>!p?'':e>=p*0.9?'km-ok':e>=p*0.7?'km-mid':'km-low';
const kmEnv=cid=>transitShips(cid).map(m=>({fecha:m.fecha||'',guia:m.guia||''}));
const pct1=v=>v.toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
function kmResumen(c,m,ps){
  const list=salidasOf(c.id),n=list.length;
  const rest=m.pend;   /* salidas de hoy en adelante sin reporte */
  const k=kmStock(c.id);
  const it=ps.map(p=>{const per=num(p.perSalida);
    const ent=list.reduce((a,s)=>a+num(S.reps[s.id]?.entregado?.[p.id]),0);
    const proy=n*per,disp=num(k.d[p.id])+num(k.t[p.id]);
    const cub=per?Math.max(0,Math.floor(disp/per)):Infinity,cub2=per?Math.max(0,Math.floor(disp/(per*2))):Infinity;
    return {p,per,ent,proy,pct:proy?ent/proy*100:0,disp,cub,cub2,
      falta:Math.max(0,rest.length*per-disp),falta2:Math.max(0,rest.length*per*2-disp)};});
  const R=rest.length;
  const grid=`<div class="km-tot">${it.map(x=>`<div class="km-ti"><span class="km-tn">${esc(x.p.name)}</span><b>${nf.format(x.ent)}<span>/${nf.format(x.proy)}</span></b><div class="km-bar"><i style="width:${Math.min(100,x.pct).toFixed(1)}%"></i></div><span class="km-tp">${pct1(x.pct)}</span></div>`).join('')}</div>`;
  return `<div class="km-res"><p class="km-rh">Total de la activación en ${esc(c.name)} · entregado vs. proyectado en las ${n} salidas</p>${grid}
</div>`;
}
function kmStock(cid){
  return {d:stockOf(cid),t:transitOf(cid),env:kmEnv(cid)};}
function viewKimby(){
  /* Datos globales */
  const M=cities().map(c=>({c,m:metrics(c.id)}));
  const totV=M.reduce((a,x)=>a+x.m.ventas,0);
  const totE=M.reduce((a,x)=>a+x.m.entregados,0);
  const totH=M.reduce((a,x)=>a+x.m.hechas,0);
  const totS=S.salidas.length;
  const pctProg=totS?Math.round(totH/totS*100):0;
  const ticketGen=totE?totV/totE:0;
  /* Merch proyectado vs entregado total (salidas hechas) */
  const ps=products();
  const totProy={},totEntr={};
  ps.forEach(p=>{totProy[p.id]=0;totEntr[p.id]=0;});
  for(const {c,m} of M){const hechasSal=salidasOf(c.id).filter(s=>S.reps[s.id]);

const KEY='kimby-landing-pw';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=pw=>pw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').toLowerCase();
let DATA=null;
async function decrypt(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.s),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.i)},key,b64(DATA.c));
  return JSON.parse(new TextDecoder().decode(pt));}
function show(d){Object.assign(S,d);$('#login').hidden=true;const v=$('#view');v.hidden=false;v.innerHTML=viewKimby();$('#logout').hidden=false;}
async function tryPw(pw,quiet){
  try{const d=await decrypt(pw);show(d);return true;}
  catch(e){if(!quiet)$('#err').textContent='Contraseña incorrecta.';return false;}}
$('#login').addEventListener('submit',async e=>{e.preventDefault();$('#err').textContent='';const pw=$('#pw').value;
  if(!DATA){$('#err').textContent='No se pudieron cargar los datos. Recarga la página.';return;}
  if(await tryPw(pw)){try{if($('#remember').checked)localStorage.setItem(KEY,pw);}catch(_){}}});
$('#logout').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(_){};location.reload();});
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(async d=>{DATA=d;let pw=null;try{pw=localStorage.getItem(KEY)}catch(_){}
  if(pw&&!(await tryPw(pw,true))){try{localStorage.removeItem(KEY)}catch(_){}}}).catch(()=>{$('#err').textContent='No se pudieron cargar los datos. Recarga la página.';});
})();
