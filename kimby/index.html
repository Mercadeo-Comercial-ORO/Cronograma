<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SCORECARD Activación Kimby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f3ef; --surface:#ffffff; --surface-2:#efe9e2; --line:#ddd4ca;
  --fg:#211a16; --muted:#6d625a;
  --brand:#d4121b; --brand-ink:#ffffff; --sun:#ffc60b;
  --band:#1d1512; --band-fg:#f7efe8; --g2:#3b2a22;
  --ok:#1f7a45; --ok-bg:#e3f2e8; --warn:#9a5a00; --warn-bg:#fdf0d3; --bad:#b3121a; --bad-bg:#fbe2e1;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17110e; --surface:#211915; --surface-2:#2b211c; --line:#3c302a; --fg:#f3ebe4; --muted:#b0a297;
  --brand:#ff3b3f; --band:#0e0a08; --g2:#ffc60b;
  --ok:#5fd18f; --ok-bg:#16301f; --warn:#f2b54a; --warn-bg:#3a2a0e; --bad:#ff7a7a; --bad-bg:#3f1515; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110e; --surface:#211915; --surface-2:#2b211c; --line:#3c302a; --fg:#f3ebe4; --muted:#b0a297;
  --brand:#ff3b3f; --band:#0e0a08; --g2:#ffc60b;
  --ok:#5fd18f; --ok-bg:#16301f; --warn:#f2b54a; --warn-bg:#3a2a0e; --bad:#ff7a7a; --bad-bg:#3f1515; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button,input{font:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance}
h2{font-stretch:85%;font-size:22px}
h3{font-stretch:90%;font-size:17px}
p{margin:0}
.mini{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header.band{background:var(--band);color:var(--band-fg);border-bottom:4px solid var(--sun)}
.band-in{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.band-in img.k{height:52px;width:auto}.band-in img.o{height:54px;width:auto}
.band-title{flex:1;min-width:200px}
.band-title h1{font-family:var(--display);font-stretch:80%;font-weight:850;font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.band-title p{margin:4px 0 0;color:#cbbdb1;font-size:13px}
main{max-width:1120px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:34px}
/* login */
.login{max-width:380px;width:calc(100% - 32px);margin:40px auto;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:14px}
.login p{color:var(--muted);font-size:14px}
.login label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.login input[type=password]{font:15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%}
.login .chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}.login .chk input{width:18px;height:18px}
.login .err{color:var(--bad);font-size:14px;min-height:1em}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--body);padding:9px 15px;border-radius:7px;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.ghost{background:none}
.foot-n{max-width:1120px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
/* secciones */
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;flex-direction:column;gap:3px}
.sec-h .step{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.sec-h p{color:var(--muted);font-size:14px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.intro{background:var(--band);color:var(--band-fg);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.intro p{font-size:15px;max-width:78ch}
.intro dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 22px;margin:0;font-size:13px;color:#cbbdb1}
.intro dt{display:inline;font-weight:700;color:#fff}.intro dd{display:inline;margin:0}
.intro .upd{font-size:12px;color:#a99b8f}
/* termómetros semicirculares */
.g{position:relative;margin:0;width:100%;max-width:250px}
.g svg{display:block;width:100%;height:auto;overflow:visible}
.g path{fill:none;stroke-width:17;stroke-linecap:round}
.g .tr{stroke:var(--line)}
.g.s1 .br{stroke:var(--brand)}.g.s2 .br{stroke:var(--g2)}
.g figcaption{position:absolute;left:0;right:0;bottom:6%;display:flex;flex-direction:column;align-items:center;gap:2px}
.g b{font-family:var(--display);font-stretch:80%;font-weight:850;font-size:clamp(28px,7vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.g.sm b{font-size:clamp(22px,5.5vw,30px)}
.g figcaption span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.g .e0,.g .e1{position:absolute;bottom:-17px;font-size:10px;color:var(--muted)}
.g .e0{left:5%}.g .e1{right:2%}
.gwrap{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.gwrap .gt{font-weight:700;font-size:14px}
.gwrap .gs{font-size:13px;color:var(--muted);max-width:30ch}
.big2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px 20px;padding:10px 4px 6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-stretch:80%;font-weight:850;font-size:clamp(22px,4vw,28px);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
/* ciudades */
.cities{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.city{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.city-h{background:var(--band);color:var(--band-fg);padding:12px 16px}
.city-h h3{font-size:19px;text-transform:uppercase;letter-spacing:.02em;color:#fff}
.city-b{padding:16px;display:flex;flex-direction:column;gap:16px;flex:1}
.city .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:6px}
.city .two .gwrap{gap:20px}
.city .two .gt{font-size:12.5px}
.kv{display:flex;flex-direction:column;gap:0;margin:0;border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);font-weight:600}
/* resumen */
.reco{margin-top:14px;border-radius:10px;padding:14px 16px;background:var(--warn-bg);font-size:14px}
.reco h4,.cmt h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.reco p{margin:0 0 6px}
.cmt{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.cmt table td{vertical-align:top}
.acl dl{display:grid;gap:12px;margin:0}.acl dl>div{font-size:14px;max-width:90ch}.acl dt{font-weight:800;font-family:var(--display);font-stretch:90%;text-transform:uppercase;font-size:13px;margin-bottom:2px}.acl dd{margin:0}
.sc-t{font-family:var(--display);font-stretch:80%;font-weight:850;font-size:clamp(24px,5vw,34px);text-transform:uppercase;margin:4px 0 14px;line-height:1}
.res p.main{font-size:16px;line-height:1.6;max-width:80ch}
.res .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}
.res .col{border-radius:10px;padding:14px 16px}
.res .col h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.res .col ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.res .pos{background:var(--ok-bg)}.res .pos h4{color:var(--ok)}
.res .adj{background:var(--warn-bg)}.res .adj h4{color:var(--warn)}
.res .byc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.res .byc div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
.res .byc b{display:block;font-family:var(--display);font-stretch:90%;text-transform:uppercase;font-size:14px;margin-bottom:3px}
.res p.main,.res .col li,.res .byc div{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.res .src{margin-top:14px}
/* pestañas de ciudad */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--body);padding:8px 16px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
/* tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2);line-height:1.25}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.foot td{background:var(--surface-2);font-weight:700}
td small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
td.res-c b{font-weight:700}
.sub-h{margin:6px 0 2px}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.scen>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.scen .tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.verdict{border-radius:8px;padding:10px 12px;font-size:14px}
.verdict.ok{background:var(--ok-bg);color:var(--fg);border-left:4px solid var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--fg);border-left:4px solid var(--bad)}
.verdict b{font-weight:700}
details.dt{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.dt+details.dt{margin-top:10px}
details.dt summary{cursor:pointer;padding:13px 16px;font-weight:700;display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;list-style:none}
details.dt summary::-webkit-details-marker{display:none}
details.dt summary::before{content:"▸";color:var(--brand)}
details.dt[open] summary::before{content:"▾"}
details.dt summary span{font-weight:500;color:var(--muted);font-size:13px;margin-left:auto}
details.dt .tbl-wrap{border:0;border-radius:0;border-top:1px solid var(--line)}
.nowrap{white-space:nowrap}
@media (max-width:700px){th,td{padding:7px 6px;font-size:13px}th{font-size:10px;letter-spacing:0}main{padding-left:12px;padding-right:12px}.scen>div{padding:10px}.c-per{display:none}.hint-scroll{display:block!important}}
.hint-scroll{display:none;font-size:12px;color:var(--muted)}
@media (max-width:520px){.city .two{gap:8px}.g .e0,.g .e1{font-size:9px}th,td{padding:8px 9px}.scen{grid-template-columns:1fr}}

<script>
(function(){
const S={config:null,salidas:[],movs:[],reps:{},resumen:null,cambio:'',at:null,tab:'',detOpen:false};
const $=s=>document.querySelector(s);
const TZ='America/Bogota';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('es-CO');
const cop=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const money=n=>cop.format(Math.round(n||0));
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.-]/g,''));return isFinite(n)?n:0};
const pct1=v=>v.toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const dec1=v=>v.toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtD=iso=>iso?new Date(iso+'T12:00:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}):'';
const todayISO=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const cities=()=>S.config?.cities||[];
const products=()=>S.config?.products||[];
const NAC='nacional';
const salidasOf=cid=>S.salidas.filter(s=>s.city===cid).sort((a,b)=>a.date.localeCompare(b.date));
/* Inventario: lo que hay en la ciudad (no cuenta lo despachado que aún no llega) y lo que va en camino */
function stockOf(cid){
  const st={};products().forEach(p=>st[p.id]=0);
  for(const m of S.movs){const it=m.items||{};
    for(const pid in it){const q=num(it[pid]);if(!(pid in st))st[pid]=0;
      if((m.tipo==='recepcion'||m.tipo==='ajuste')&&m.ciudad===cid)st[pid]+=q;
      else if(m.tipo==='traslado'){if(m.destino===cid&&m.estado!=='despachado')st[pid]+=q;if(m.origen===cid)st[pid]-=q;}}}
  for(const sid in S.reps){const r=S.reps[sid];const rc=S.salidas.find(x=>x.id===sid)?.city||r.city;if(rc!==cid)continue;const e=r.entregado||{};for(const pid in e){if(!(pid in st))st[pid]=0;st[pid]-=num(e[pid]);}}
  return st;
}
function transitOf(cid){const st={};products().forEach(p=>st[p.id]=0);
  for(const m of S.movs){if(m.tipo!=='traslado'||m.destino!==cid||m.estado!=='despachado')continue;for(const pid in (m.items||{}))st[pid]=(st[pid]||0)+num(m.items[pid]);}return st;}
const sumD=(o,ids)=>ids.reduce((a,id)=>a+num(o[id]),0);

/* ---------- Cálculo por ciudad ---------- */
function proyectar(rest,disp,per){
  /* rest: salidas que faltan; disp: disponible por producto; per: merch por salida y producto */
  const ps=products();
  const rows=ps.map(p=>{const pp=per[p.id]||0,need=Math.ceil(rest.length*pp-1e-9),d=num(disp[p.id]);return {p,per:pp,need,disp:d,diff:d-need};});
  let minK=Infinity,lim=null;
  for(const r of rows){if(r.per>0){const k=Math.floor((r.disp+1e-9)/r.per);if(k<minK){minK=k;lim=r.p;}}}
  const K=Math.max(0,Math.min(minK,rest.length)),full=K>=rest.length;
  return {rows,K,full,lim:full?null:lim,last:K>0?rest[K-1].date:null,nextShort:full?null:rest[K].date,
    falt:rows.reduce((a,r)=>a+Math.max(0,-r.diff),0),sobra:rows.reduce((a,r)=>a+Math.max(0,r.diff),0),
    needT:rows.reduce((a,r)=>a+r.need,0),dispT:rows.reduce((a,r)=>a+r.disp,0),nFalt:rows.filter(r=>r.diff<0).length};
}
function cityData(c){
  const ps=products(),ids=ps.map(p=>p.id);
  const list=salidasOf(c.id),N=list.length;
  const done=list.filter(s=>S.reps[s.id]),H=done.length,rest=list.filter(s=>!S.reps[s.id]);
  const st=stockOf(c.id),tr=transitOf(c.id);
  const plan={},dbl={},cons={},ciu={},cam={},disp={};
  ps.forEach(p=>{plan[p.id]=p.base*N;dbl[p.id]=p.doble*N;cons[p.id]=done.reduce((a,s)=>a+num(S.reps[s.id].entregado?.[p.id]),0);
    ciu[p.id]=num(st[p.id]);cam[p.id]=num(tr[p.id]);disp[p.id]=ciu[p.id]+cam[p.id];});
  /* ritmo real: promedio por salida desde que se permite entregar hasta el doble; si aún no hay, el de todas las salidas */
  const post=done.filter(s=>s.date>=S.cambio),base=post.length?post:done;
  const avg={};ps.forEach(p=>{avg[p.id]=base.length?base.reduce((a,s)=>a+num(S.reps[s.id].entregado?.[p.id]),0)/base.length:p.base;});
  const dper={};ps.forEach(p=>dper[p.id]=p.doble);
  const reps=done.map(s=>S.reps[s.id]);
  const rat=reps.map(r=>r.rating).filter(v=>v!==null&&v!==undefined&&v!=='');
  const flujo={alto:0,medio:0,bajo:0};reps.forEach(r=>{if(flujo[r.flujo]!==undefined)flujo[r.flujo]++;});
  const hoy=todayISO();
  return {c,list,N,H,rest,next:rest.find(s=>s.date>=hoy)||rest[0]||null,last:list[N-1]||null,plan,dbl,cons,ciu,cam,disp,avg,nBase:base.length,usaPost:post.length>0,
    planT:sumD(plan,ids),dblT:sumD(dbl,ids),consT:sumD(cons,ids),ciuT:sumD(ciu,ids),camT:sumD(cam,ids),dispT:sumD(disp,ids),
    ventas:reps.reduce((a,r)=>a+num(r.ventas),0),flujo,rating:rat.length?rat.reduce((a,v)=>a+num(v),0)/rat.length:null,ratN:rat.length,
    A:proyectar(rest,disp,dper),B:proyectar(rest,disp,avg)};
}

/* ---------- Componentes ---------- */
function gauge(p,main,sub,cls,label){
  const v=Math.max(0,Math.min(100,p||0));
  return `<figure class="g ${cls}" role="img" aria-label="${esc(label)}"><svg viewBox="0 0 200 106" aria-hidden="true"><path class="tr" d="M20 100A80 80 0 0 1 180 100" pathLength="100"/>${v>0?`<path class="br" d="M20 100A80 80 0 0 1 180 100" pathLength="100" stroke-dasharray="${v.toFixed(2)} 100"/>`:''}</svg><figcaption><b>${main}</b><span>${sub}</span></figcaption><i class="e0">0%</i><i class="e1">100%</i></figure>`;
}
const gSal=(H,N,sm)=>{const p=N?H/N*100:0;return gauge(p,pct1(p),`${nf.format(H)} de ${nf.format(N)}`,'s1'+(sm?' sm':''),`Salidas ejecutadas: ${H} de ${N}, ${pct1(p)}`);};
const gMer=(C,P,sm)=>{const p=P?C/P*100:0;return gauge(p,pct1(p),`${nf.format(C)} de ${nf.format(P)}`,'s2'+(sm?' sm':''),`Merch consumido: ${C} de ${P} unidades, ${pct1(p)}`);};

function viewKimby(){
  const ps=products(),ids=ps.map(p=>p.id);
  let _n=0;const st=()=>++_n;
  const D=cities().map(cityData);
  const T={N:0,H:0,planT:0,dblT:0,consT:0,ciuT:0,camT:0,dispT:0,ventas:0,flujo:{alto:0,medio:0,bajo:0},rs:0,rn:0};
  D.forEach(d=>{['N','H','planT','dblT','consT','ciuT','camT','dispT','ventas'].forEach(k=>T[k]+=d[k]);
    for(const k in d.flujo)T.flujo[k]+=d.flujo[k];if(d.rating!==null){T.rs+=d.rating*d.ratN;T.rn+=d.ratN;}});

/* Recomendación entre ciudades (escenario B: ritmo real de cada ciudad) */
function recoHtml(D,ps,sel){
  const give=[],left=[];
  ps.forEach(p=>{
    const row=d=>d.B.rows.find(r=>r.p.id===p.id);
    const don=D.map(d=>({d,s:Math.max(0,row(d).diff)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
    const rec=D.map(d=>({d,f:Math.max(0,-row(d).diff)})).filter(x=>x.f>0).sort((a,b)=>b.f-a.f);
    for(const r of rec){let f=r.f;for(const dn of don){if(f<=0)break;const q=Math.min(dn.s,f);if(q>0){dn.s-=q;f-=q;give.push({from:dn.d.c.name,to:r.d.c.name,p:p.name.toLowerCase(),q});}}
      if(f>0)left.push({to:r.d.c.name,p:p.name.toLowerCase(),q:f});}
  });
  const lst=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];
  const me=sel.c.name,items=a=>lst(a.map(g=>`${nf.format(g.q)} ${g.q===1?'unidad':'unidades'} de ${esc(g.p)}`));
  const recv=give.filter(g=>g.to===me),gave=give.filter(g=>g.from===me),miss=left.filter(l=>l.to===me);
  const parts=[];
  if(recv.length){const froms=[...new Set(recv.map(g=>g.from))];
    parts.push(`<b>${esc(me)}</b> necesitaría refuerzo si sigue al ritmo real que lleva: ${lst(froms.map(f=>`${esc(f)} podría aportar ${items(recv.filter(g=>g.from===f))}`))}.`);}
  if(miss.length)parts.push(`${recv.length?'Aun con ese apoyo':'Si sigue al ritmo real que lleva'}, a ${esc(me)} le quedarían sin cubrir ${lst(miss.map(l=>`${nf.format(l.q)} ${l.q===1?'unidad':'unidades'} de ${esc(l.p)}`))}, que habría que reponer con nuevo despacho.`);
  if(gave.length){const tos=[...new Set(gave.map(g=>g.to))];
    parts.push(`<b>${esc(me)}</b> tendría merch de sobra y podría aportar ${lst(tos.map(t=>`${items(gave.filter(g=>g.to===t))} a ${esc(t)}`))}.`);}
  if(!parts.length)parts.push(`Si <b>${esc(me)}</b> sigue entregando al ritmo real que lleva, le alcanza el merch para terminar sus salidas y no necesita refuerzo de otras ciudades ni tiene sobrantes importantes para aportar.`);
  const txt=parts.join(' ');
  return `<div class="reco"><h4>Recomendación para ${esc(sel.c.name)}</h4><p>${txt}</p><p class="mini">Es una estimación con el ritmo de entrega actual y no está asegurada al 100 %: depende de cómo se entregue el merch en las salidas que faltan (si una ciudad entrega más o menos de lo habitual, sus sobrantes y faltantes cambian).</p></div>`;
}
/* ---------- Merch y detalle de la ciudad elegida ---------- */
function renderMerch(D){
  const ps=products(),ids=ps.map(p=>p.id);
  const d=D.find(x=>x.c.id===S.tab)||D[0];
  const tabs=D.map(x=>`<button type="button" data-t="${x.c.id}" aria-pressed="${x.c.id===d.c.id}">${esc(x.c.name)}</button>`).join('');
  document.querySelectorAll('[data-tabs]').forEach(el=>el.innerHTML=tabs);
  const R=d.rest.length;
  const lineV=(sc)=>{
    if(R===0)return {cls:'ok',t:'Ya se ejecutaron todas las salidas.'};
    if(sc.full)return {cls:'ok',t:`<b>Alcanza</b> para completar las ${R} salidas que faltan.`};
    const lim=sc.lim?` Lo primero que se agota: <b>${esc(sc.lim.name)}</b>.`:'';
    if(sc.K===0)return {cls:'bad',t:`<b>No alcanza ni para la próxima salida</b> (${esc(fmtD(sc.nextShort))}).${lim} Para completar las ${R} salidas faltan ${nf.format(sc.falt)} unidades.`};
    return {cls:'bad',t:`<b>Alcanza hasta la salida del ${esc(fmtD(sc.last))}</b> (${sc.K} de ${R}).${lim} Para completar las ${R} salidas faltan ${nf.format(sc.falt)} unidades.`};
  };
  const res=r=>r.diff<0?`<span class="bad nowrap"><b>Faltan ${nf.format(-r.diff)}</b></span>`:r.diff===0?`<span class="nowrap">Justo</span>`:`<span class="ok nowrap">Sobran ${nf.format(r.diff)}</span>`;
  const scTbl=(sc,perLbl,dec)=>`<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th class="r c-per">${perLbl}</th><th class="r">Necesario</th><th class="r">Disponible</th><th class="r">Resultado</th></tr></thead><tbody>
    ${sc.rows.map(r=>`<tr><td>${esc(r.p.name)}</td><td class="r c-per">${dec?dec1(r.per):nf.format(r.per)}</td><td class="r">${nf.format(r.need)}</td><td class="r">${nf.format(r.disp)}</td><td class="r">${res(r)}</td></tr>`).join('')}
    <tr class="foot"><td>Total unidades</td><td class="r c-per"></td><td class="r">${nf.format(sc.needT)}</td><td class="r">${nf.format(sc.dispT)}</td><td class="r">${(()=>{const n=sc.dispT-sc.needT;return n<0?`<span class="bad nowrap">Faltan ${nf.format(-n)}</span>`:n>0?`<span class="ok nowrap">Sobran ${nf.format(n)}</span>`:'<span class="nowrap">Justo</span>';})()}</td></tr></tbody></table></div><p class="mini" style="margin:6px 2px 0">El total es la diferencia neta (disponible − necesario); un producto que sobra no reemplaza a otro que falta.</p>`;
  const vA=lineV(d.A),vB=lineV(d.B);
  $('#merch').innerHTML=`<div class="scen">
    <div><span class="tag">Escenario A</span><h3>Si en todas las salidas que faltan se entrega el doble</h3>
      <p class="mini">Se calcula con el máximo permitido por salida (el doble del plan inicial) en las ${R} salidas que faltan.</p>
      <div class="verdict ${vA.cls}">${vA.t}</div>${scTbl(d.A,'Por salida',false)}</div>
    <div><span class="tag">Escenario B</span><h3>Si seguimos entregando al ritmo real de ${esc(d.c.name)}</h3>
      <p class="mini">Se calcula con el promedio entregado por salida ${d.usaPost?`desde el ${esc(fmtD(S.cambio))} (${d.nBase} salidas)`:`en las ${d.nBase} salidas ejecutadas`}, en las ${R} salidas que faltan.</p>
      <div class="verdict ${vB.cls}">${vB.t}</div>${scTbl(d.B,'Promedio por salida',true)}${recoHtml(D,ps,d)}</div>
  </div>`;
  /* Detalle: solo la ciudad elegida */
  const done=d.list.filter(s=>S.reps[s.id]);
  const tot={};ps.forEach(p=>tot[p.id]=0);
  const rows=done.map(s=>{const r=S.reps[s.id],e=r.entregado||{};let te=0;
    const tds=ps.map(p=>{const v=num(e[p.id]);tot[p.id]+=v;te+=v;return `<td class="r">${nf.format(v)}</td>`;}).join('');
    return `<tr><td class="nowrap"><b>${esc(fmtD(s.date))}</b></td><td>${esc(r.pdv||s.pdv||'—')}</td>${tds}<td class="r"><b>${nf.format(te)}</b></td></tr>`;}).join('');
  const gt=ids.reduce((a,id)=>a+tot[id],0);
  $('#detalle').innerHTML=`<details class="dt"${S.detOpen?' open':''}><summary>${esc(d.c.name)} <span>${d.H} de ${d.N} salidas ejecutadas</span></summary>
    ${done.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Punto de venta</th>${ps.map(p=>`<th class="r">${esc(p.name)}<br><span style="font-weight:500">(${p.base})</span></th>`).join('')}<th class="r">Total</th></tr></thead><tbody>${rows}
    <tr class="foot"><td colspan="2">Total ${esc(d.c.name)}</td>${ps.map(p=>`<td class="r">${nf.format(tot[p.id])}</td>`).join('')}<td class="r">${nf.format(gt)}</td></tr></tbody></table></div>`
    :`<p class="mini" style="padding:14px 16px">Aún no hay salidas ejecutadas en esta ciudad.</p>`}</details>`;
}

const KEY='kimby-landing-pw';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=pw=>pw.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'').toLowerCase();
let DATA=null;
async function decrypt(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.s),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.i)},key,b64(DATA.c));
  return JSON.parse(new TextDecoder().decode(pt));}
function show(d){
  Object.assign(S,{config:d.config,salidas:d.salidas||[],movs:d.movs||[],reps:d.reps||{},resumen:d.resumen||null,cambio:d.cambio||'2026-10-16',at:d.at});
  $('#login').hidden=true;const v=$('#view');v.hidden=false;v.innerHTML=viewKimby();$('#logout').hidden=false;
  const D=cities().map(cityData);S.tab=D[0].c.id;S.detOpen=false;renderMerch(D);
  v.addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(!b)return;S.tab=b.dataset.t;renderMerch(D);});
  v.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.dt'))S.detOpen=e.target.open;},true);
}
async function tryPw(pw,quiet){
  try{const d=await decrypt(pw);show(d);return true;}
  catch(e){if(!quiet)$('#err').textContent='Contraseña incorrecta.';return false;}}
$('#login').addEventListener('submit',async e=>{e.preventDefault();$('#err').textContent='';const pw=$('#pw').value;
  if(!DATA){$('#err').textContent='No se pudieron cargar los datos. Recarga la página.';return;}
  if(await tryPw(pw)){try{if($('#remember').checked)localStorage.setItem(KEY,pw);}catch(_){}}});
$('#logout').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(_){};location.reload();});
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(async d=>{DATA=d;let pw=null;try{pw=localStorage.getItem(KEY)}catch(_){}
  if(pw&&!(await tryPw(pw,true))){try{localStorage.removeItem(KEY)}catch(_){}}}).catch(()=>{$('#err').textContent='No se pudieron cargar los datos. Recarga la página.';});
})();
